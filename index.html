<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0c">
  <title>Zeyad Davids</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0c;
      overflow: hidden;
    }
    .mosaic {
      position: fixed;
      inset: 0;
    }

    /* Each tile is a framed panel that drifts and breathes on its own clock */
    .tile {
      position: absolute;
      overflow: hidden;
      background: #16161a;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      opacity: 0;
      animation:
        appear 2.5s ease-out var(--in, 0s) forwards,
        drift var(--drift, 24s) ease-in-out var(--delay, 0s) infinite alternate,
        breathe var(--breathe, 18s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    /* The photo inside zooms in and out at yet another rate */
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: zoom var(--zoom, 20s) ease-in-out var(--delay, 0s) infinite alternate;
    }

    @keyframes appear {
      to { opacity: 1; }
    }
    @keyframes drift {
      from { translate: calc(var(--dx, 1.5vw) * -1) calc(var(--dy, 1.5vh) * -1); }
      to   { translate: var(--dx, 1.5vw) var(--dy, 1.5vh); }
    }
    @keyframes breathe {
      from { scale: var(--s-min, 0.95); }
      to   { scale: var(--s-max, 1.04); }
    }
    @keyframes zoom {
      from { scale: 1.02; }
      to   { scale: var(--z-max, 1.25); }
    }

    /* Desktop / landscape composition */
    .t1 { left: 6%;  top: 9%;  width: 38%; height: 50%; z-index: 2;
          --drift: 26s; --breathe: 19s; --zoom: 31s; --dx: 1.2vw; --dy: 2vh;   --delay: -7s;  --in: 0s; }
    .t2 { left: 14%; top: 61%; width: 40%; height: 31%; z-index: 3;
          --drift: 21s; --breathe: 27s; --zoom: 17s; --dx: 2vw;   --dy: 1vh;   --delay: -13s; --in: .4s; }
    .t3 { left: 48%; top: 6%;  width: 18%; height: 46%; z-index: 4;
          --drift: 17s; --breathe: 14s; --zoom: 23s; --dx: 1vw;   --dy: 2.5vh; --delay: -3s;  --in: .8s;
          --s-min: 0.92; --s-max: 1.06; }
    .t4 { left: 70%; top: 14%; width: 24%; height: 34%; z-index: 2;
          --drift: 29s; --breathe: 22s; --zoom: 13s; --dx: 1.8vw; --dy: 1.5vh; --delay: -19s; --in: 1.2s;
          --z-max: 1.15; }
    .t5 { left: 61%; top: 55%; width: 22%; height: 39%; z-index: 3;
          --drift: 23s; --breathe: 16s; --zoom: 27s; --dx: 1.4vw; --dy: 2vh;   --delay: -10s; --in: 1.6s;
          --s-min: 0.93; --s-max: 1.05; }

    /* Phone / portrait composition */
    @media (max-aspect-ratio: 4/5) {
      .t1 { left: 5%;  top: 5%;  width: 60%; height: 29%; }
      .t3 { left: 69%; top: 8%;  width: 26%; height: 34%; }
      .t4 { left: 8%;  top: 37%; width: 52%; height: 23%; }
      .t5 { left: 63%; top: 46%; width: 31%; height: 29%; }
      .t2 { left: 5%;  top: 64%; width: 66%; height: 28%; }
      .tile { --dx: 2vw; --dy: 1vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile { animation: appear 1.5s ease-out forwards; }
      .tile img { animation: none; }
    }
  </style>
</head>
<body>
  <div class="mosaic" aria-hidden="true">
    <div class="tile t1"><img alt="" fetchpriority="high"
      srcset="images/1-1080.webp 1080w, images/1-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 90vw, 50vw" src="images/1-1080.webp"></div>
    <div class="tile t2"><img alt="" decoding="async"
      srcset="images/2-1080.webp 1080w, images/2-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 90vw, 50vw" src="images/2-1080.webp"></div>
    <div class="tile t3"><img alt="" decoding="async"
      srcset="images/3-1080.webp 1080w, images/3-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 60vw, 40vw" src="images/3-1080.webp"></div>
    <div class="tile t4"><img alt="" decoding="async"
      srcset="images/4-1080.webp 1080w, images/4-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 80vw, 35vw" src="images/4-1080.webp"></div>
    <div class="tile t5"><img alt="" decoding="async"
      srcset="images/5-1080.webp 1080w, images/5-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 60vw, 35vw" src="images/5-1080.webp"></div>
  </div>
</body>
</html>
