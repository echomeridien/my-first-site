<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0c">
  <title>Zeyad Davids</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0c;
      overflow: hidden;
    }
    .mosaic {
      position: fixed;
      inset: 0;
    }

    /* Registered so x and y can animate on separate clocks, tracing slow curved paths */
    @property --x { syntax: "<length>"; inherits: false; initial-value: 0px; }
    @property --y { syntax: "<length>"; inherits: false; initial-value: 0px; }

    /* Each tile is a framed panel that drifts and breathes on its own clock */
    .tile {
      position: absolute;
      overflow: hidden;
      background: #16161a;
      box-shadow: 0 40px 80px -25px rgba(0, 0, 0, 0.85);
      opacity: 0;
      translate: var(--x) var(--y);
      --ease: cubic-bezier(0.45, 0, 0.55, 1);
      animation:
        appear 2.5s ease-out var(--in, 0s) forwards,
        drift-x var(--drift-x, 24s) var(--ease) var(--delay, 0s) infinite alternate,
        drift-y var(--drift-y, 19s) var(--ease) var(--delay, 0s) infinite alternate,
        breathe var(--breathe, 18s) var(--ease) var(--delay, 0s) infinite alternate;
    }
    /* The photo inside zooms in and out at yet another rate */
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: zoom var(--zoom, 20s) var(--ease) var(--delay, 0s) infinite alternate;
    }

    @keyframes appear {
      to { opacity: 1; }
    }
    @keyframes drift-x {
      from { --x: calc(var(--dx, 4vw) * -1); }
      to   { --x: var(--dx, 4vw); }
    }
    @keyframes drift-y {
      from { --y: calc(var(--dy, 5vh) * -1); }
      to   { --y: var(--dy, 5vh); }
    }
    @keyframes breathe {
      from { scale: var(--s-min, 0.86); }
      to   { scale: var(--s-max, 1.1); }
    }
    @keyframes zoom {
      from { scale: 1; }
      to   { scale: var(--z-max, 1.45); }
    }

    /* Desktop / landscape composition */
    .t1 { left: 6%;  top: 9%;  width: 38%; height: 50%; z-index: 2;
          --drift-x: 23s; --drift-y: 31s; --breathe: 19s; --zoom: 26s; --dx: 3vw;   --dy: 5vh; --delay: -7s;  --in: 0s; }
    .t2 { left: 14%; top: 61%; width: 40%; height: 31%; z-index: 3;
          --drift-x: 19s; --drift-y: 14s; --breathe: 24s; --zoom: 15s; --dx: 5vw;   --dy: 4vh; --delay: -13s; --in: .4s; }
    .t3 { left: 48%; top: 6%;  width: 18%; height: 46%; z-index: 4;
          --drift-x: 27s; --drift-y: 17s; --breathe: 13s; --zoom: 21s; --dx: 3.5vw; --dy: 7vh; --delay: -3s;  --in: .8s;
          --s-min: 0.82; --s-max: 1.14; }
    .t4 { left: 70%; top: 14%; width: 24%; height: 34%; z-index: 2;
          --drift-x: 16s; --drift-y: 25s; --breathe: 21s; --zoom: 12s; --dx: 4.5vw; --dy: 5vh; --delay: -19s; --in: 1.2s;
          --z-max: 1.3; }
    .t5 { left: 61%; top: 55%; width: 22%; height: 39%; z-index: 3;
          --drift-x: 29s; --drift-y: 20s; --breathe: 15s; --zoom: 24s; --dx: 4vw;   --dy: 6vh; --delay: -10s; --in: 1.6s;
          --s-min: 0.84; --s-max: 1.12; }

    /* Phone / portrait composition */
    @media (max-aspect-ratio: 4/5) {
      .t1 { left: 5%;  top: 5%;  width: 60%; height: 29%; }
      .t3 { left: 69%; top: 8%;  width: 26%; height: 34%; }
      .t4 { left: 8%;  top: 37%; width: 52%; height: 23%; }
      .t5 { left: 63%; top: 46%; width: 31%; height: 29%; }
      .t2 { left: 5%;  top: 64%; width: 66%; height: 28%; }
      .tile { --dx: 4vw; --dy: 3vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile { animation: appear 1.5s ease-out forwards; }
      .tile img { animation: none; }
    }
  </style>
</head>
<body>
  <div class="mosaic" aria-hidden="true">
    <div class="tile t1"><img alt="" fetchpriority="high"
      srcset="images/1-1080.webp 1080w, images/1-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 90vw, 50vw" src="images/1-1080.webp"></div>
    <div class="tile t2"><img alt="" decoding="async"
      srcset="images/2-1080.webp 1080w, images/2-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 90vw, 50vw" src="images/2-1080.webp"></div>
    <div class="tile t3"><img alt="" decoding="async"
      srcset="images/3-1080.webp 1080w, images/3-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 60vw, 40vw" src="images/3-1080.webp"></div>
    <div class="tile t4"><img alt="" decoding="async"
      srcset="images/4-1080.webp 1080w, images/4-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 80vw, 35vw" src="images/4-1080.webp"></div>
    <div class="tile t5"><img alt="" decoding="async"
      srcset="images/5-1080.webp 1080w, images/5-1920.webp 1920w" sizes="(max-aspect-ratio: 4/5) 60vw, 35vw" src="images/5-1080.webp"></div>
  </div>
</body>
</html>
